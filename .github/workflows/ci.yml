name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run tests
        run: ./scripts/test.sh
      - name: Build app
        env:
          LIDSCAPE_SIGN_IDENTITY: '-'
        run: ./scripts/build.sh
      - name: Verify signature
        run: codesign --verify --deep --strict build/Lidscape.app
